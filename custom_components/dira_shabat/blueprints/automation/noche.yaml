blueprint:
  name: Dira Shabat — Noche
  description: >
    Acciones nocturnas (luces, switches, ventiladores, cortinas, A/C) durante
    issur melacha o, opcionalmente, durante Erev Shabat/Jag. El filtro de cena
    (Casa / Afuera) sigue disponible para condicionar las acciones según si
    cenamos en casa o no.
  domain: automation
  source_url: https://github.com/DiraSmart/dira-shabat/blob/master/custom_components/dira_shabat/blueprints/automation/noche.yaml
  input:
    hora:
      name: Hora fija
      description: >
        A qué hora del día se dispara la acción. Ignorado si elegís un
        helper en la sección "Helper de hora".
      default: "21:00:00"
      selector:
        time:
    helper_settings:
      name: Helper de hora (opcional)
      icon: mdi:clock-time-four-outline
      collapsed: true
      input:
        hora_helper:
          name: Helper input_datetime
          description: >
            Si se selecciona, ignora la "Hora fija" y usa el valor de
            este input_datetime con hora. Útil para una hora editable
            desde un dashboard.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        hora_helper_dira:
          name: Helper sensor Dira Shabat (alternativa)
          description: >
            Velas o havdalá del día. Tiene prioridad sobre el helper
            de arriba si están ambos seteados.
          default: ""
          selector:
            entity:
              include_entities:
                - sensor.dira_shabat_candle_lighting
                - sensor.dira_shabat_havdalah
        offset_min:
          name: Desfase (minutos)
          description: >
            Aplicado sobre el helper. Positivo = después, negativo =
            antes. Ej: -15 para encender luces 15 min antes del helper.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              step: 1
              unit_of_measurement: min
              mode: box
    opciones:
      name: ¿Depende de la cena?
      description: >
        Casa = solo si cenamos en casa. Afuera = solo si NO cenamos en casa.
        Siempre = ignora la cena y corre cuando hay issur.
      default: siempre
      selector:
        select:
          options:
            - label: Solo si cena en Casa
              value: "on"
            - label: Solo si cena Afuera
              value: "off"
            - label: Siempre (ignora la cena)
              value: siempre

    advanced_filters:
      name: Filtros avanzados (opcional)
      icon: mdi:filter-variant
      collapsed: true
      input:
        dia_filtro:
          name: Día del período
          description: Solo correr si el día actual cumple esta regla
          default: cualquiera
          selector:
            select:
              options:
                - label: Cualquier día
                  value: cualquiera
                - label: Solo último día
                  value: ultimo
                - label: Cualquier día menos el último
                  value: no_ultimo
        skip_ends_today:
          name: Saltear si shabat/jag termina hoy
          description: >
            Si se activa, la automatización NO corre cuando quedan menos
            de 6h para havdalá.
          default: false
          selector:
            boolean:
        notify_target:
          name: Notificación al ejecutar (opcional)
          description: Servicio de notify para confirmación / debug
          default: ""
          selector:
            text:
        permitir_erev:
          name: Permitir disparo durante Erev (antes de velas)
          description: >
            Default OFF. Si lo activás, la automatización puede correr
            también durante Erev Shabat/Jag (antes del encendido de
            velas). Útil para tareas previas — cámaras, neveras, prep —
            así el cliente todavía tiene margen si algo falla.
            Importante: con esta opción usá "Día del período = Cualquier
            día", porque durante Erev el sensor current_day todavía es 0.
          default: false
          selector:
            boolean:
        respeto_override:
          name: Respetar override manual en retries
          description: >
            Default ON. En los retries (+3 y +6 min), si una entidad fue
            tocada por el usuario después de la hora programada, no se
            la vuelve a tocar. Solo aplica a retries — el primer disparo
            siempre actúa.
          default: true
          selector:
            boolean:

    lights_on_settings:
      name: Luces a encender
      icon: mdi:lightbulb-group
      collapsed: true
      input:
        light_on:
          name: Encender
          default: {}
          selector:
            target:
              entity:
                domain: light
        light_on_brightness:
          name: Brillo
          description: >
            Porcentaje de brillo al encender. 100 = máximo. Las luces
            que no soportan brillo igual se prenden (el parámetro se
            ignora silenciosamente).
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              step: 1
              mode: slider
        light_on_transition:
          name: Fade in (segundos)
          description: >
            Tiempo de transición al encender. 0 = instantáneo
            (comportamiento por default). Útil para que las luces suban
            suavemente al inicio de cena/almuerzo.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: s
              step: 1
              mode: slider
    lights_off_settings:
      name: Luces a apagar
      icon: mdi:lightbulb-group-off-outline
      collapsed: true
      input:
        light_off:
          name: Apagar
          default: {}
          selector:
            target:
              entity:
                domain: light
    switches_on_settings:
      name: Switches a encender
      icon: mdi:toggle-switch
      collapsed: true
      input:
        switch_on:
          name: Encender
          default: {}
          selector:
            target:
              entity:
                domain: switch
    switches_off_settings:
      name: Switches a apagar
      icon: mdi:toggle-switch-off
      collapsed: true
      input:
        switch_off:
          name: Apagar
          default: {}
          selector:
            target:
              entity:
                domain: switch
    fans_on_settings:
      name: Ventiladores a encender
      icon: mdi:fan
      collapsed: true
      input:
        fan_on:
          name: Encender
          default: {}
          selector:
            target:
              entity:
                domain: fan
    fans_off_settings:
      name: Ventiladores a apagar
      icon: mdi:fan-off
      collapsed: true
      input:
        fan_off:
          name: Apagar
          default: {}
          selector:
            target:
              entity:
                domain: fan
    covers_open_settings:
      name: Cortinas a abrir
      icon: mdi:blinds-open
      collapsed: true
      input:
        cover_open:
          name: Abrir
          default: {}
          selector:
            target:
              entity:
                domain: cover
    covers_close_settings:
      name: Cortinas a cerrar
      icon: mdi:blinds
      collapsed: true
      input:
        cover_close:
          name: Cerrar
          default: {}
          selector:
            target:
              entity:
                domain: cover
    climate_on_settings:
      name: A/C a encender (grupo 1)
      icon: mdi:air-conditioner
      collapsed: true
      input:
        airc_on:
          name: Encender
          default: {}
          selector:
            target:
              entity:
                domain:
                  - climate
        airc_mode:
          name: Modo
          description: Modo HVAC al encender. Default = cool.
          default: cool
          selector:
            select:
              mode: dropdown
              options:
                - label: Cool (frío)
                  value: cool
                - label: Heat (calor)
                  value: heat
                - label: Dry (deshumidificar)
                  value: dry
                - label: Fan only (solo ventilador)
                  value: fan_only
                - label: Auto
                  value: auto
        airc_fan_mode:
          name: Velocidad ventilador
          description: >
            Velocidad del ventilador del A/C. "(sin cambio)" no toca lo
            que ya estaba seteado en el equipo.
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: "(sin cambio)"
                  value: ""
                - label: Low
                  value: low
                - label: Medium
                  value: medium
                - label: High
                  value: high
                - label: Auto
                  value: auto
        temp_to_set:
          name: Temperatura fija
          description: >
            Ignorada si elegís un helper en "Helper de temperatura". En
            modos sin temperatura (fan_only, dry) se ignora también.
          default: 22
          selector:
            number:
              min: 16
              max: 30
              unit_of_measurement: °C
              step: 1
              mode: slider
        temp_entity:
          name: Helper de temperatura (opcional)
          description: >
            Si se selecciona, ignora la "Temperatura fija" y usa el valor
            de este input_number / number.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - input_number
                    - number
    climate_on_settings_2:
      name: A/C a encender (grupo 2)
      icon: mdi:air-conditioner
      collapsed: true
      input:
        airc_on_2:
          name: Encender
          description: >
            Segundo grupo de A/C, útil si querés setear dos aires
            distintos a la misma hora con temperaturas diferentes.
          default: {}
          selector:
            target:
              entity:
                domain:
                  - climate
        airc_mode_2:
          name: Modo
          description: Modo HVAC al encender. Default = cool.
          default: cool
          selector:
            select:
              mode: dropdown
              options:
                - label: Cool (frío)
                  value: cool
                - label: Heat (calor)
                  value: heat
                - label: Dry (deshumidificar)
                  value: dry
                - label: Fan only (solo ventilador)
                  value: fan_only
                - label: Auto
                  value: auto
        airc_fan_mode_2:
          name: Velocidad ventilador
          description: >
            Velocidad del ventilador del A/C. "(sin cambio)" no toca lo
            que ya estaba seteado en el equipo.
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: "(sin cambio)"
                  value: ""
                - label: Low
                  value: low
                - label: Medium
                  value: medium
                - label: High
                  value: high
                - label: Auto
                  value: auto
        temp_to_set_2:
          name: Temperatura fija
          description: >
            Ignorada si elegís un helper en "Helper de temperatura".
          default: 22
          selector:
            number:
              min: 16
              max: 30
              unit_of_measurement: °C
              step: 1
              mode: slider
        temp_entity_2:
          name: Helper de temperatura (opcional)
          description: >
            Si se selecciona, ignora la "Temperatura fija" y usa el valor
            de este input_number / number.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - input_number
                    - number
    climate_off_settings:
      name: A/C a apagar
      icon: mdi:fan-off
      collapsed: true
      input:
        airc_off:
          name: Apagar
          default: {}
          selector:
            target:
              entity:
                domain:
                  - climate

mode: single

trigger_variables:
  var_time: !input hora
  var_helper_dt: !input hora_helper
  var_helper_dira: !input hora_helper_dira
  var_helper: "{{ var_helper_dira if var_helper_dira else var_helper_dt }}"
  var_offset: !input offset_min

variables:
  var_opciones: !input opciones
  var_dia_filtro: !input dia_filtro
  var_skip_ends: !input skip_ends_today
  var_notify: !input notify_target
  var_temp: !input temp_to_set
  var_temp_entity: !input temp_entity
  var_temp_2: !input temp_to_set_2
  var_temp_entity_2: !input temp_entity_2
  var_brightness: !input light_on_brightness
  var_transition: !input light_on_transition
  var_airc_mode: !input airc_mode
  var_airc_mode_2: !input airc_mode_2
  var_airc_fan_mode: !input airc_fan_mode
  var_airc_fan_mode_2: !input airc_fan_mode_2
  var_helper_dt_var: !input hora_helper
  var_helper_dira_var: !input hora_helper_dira
  var_helper_var: "{{ var_helper_dira_var if var_helper_dira_var else var_helper_dt_var }}"
  var_permitir_erev: !input permitir_erev
  var_respeto_override: !input respeto_override
  var_time_var: !input hora
  var_offset_var: !input offset_min
  scheduled_time: >-
    {% if var_helper_var %}
      {% set raw = states(var_helper_var) %}
      {% if raw and raw not in ['unknown','unavailable','--:--'] %}
        {% set tp = raw.split(' ')[-1] %}
        {{ today_at(tp) + timedelta(minutes=var_offset_var | int(0)) }}
      {% else %}
        {{ today_at(var_time_var) }}
      {% endif %}
    {% else %}
      {{ today_at(var_time_var) }}
    {% endif %}
  light_on: !input light_on
  light_off: !input light_off
  switch_on: !input switch_on
  switch_off: !input switch_off
  fan_on: !input fan_on
  fan_off: !input fan_off
  cover_open: !input cover_open
  cover_close: !input cover_close
  airc_on: !input airc_on
  airc_on_2: !input airc_on_2
  airc_off: !input airc_off

trigger:
  - platform: time
    at: !input hora
    id: fija
  - platform: template
    value_template: "{{ now() >= (today_at(var_time) + timedelta(minutes=3)) }}"
    id: fija_3
  - platform: template
    value_template: "{{ now() >= (today_at(var_time) + timedelta(minutes=6)) }}"
    id: fija_6
  - platform: template
    value_template: >-
      {% if var_helper %}
        {% set raw = states(var_helper) %}
        {% if raw and raw not in ['unknown','unavailable','--:--'] %}
          {% set tp = raw.split(' ')[-1] %}
          {{ now() >= (today_at(tp) + timedelta(minutes=var_offset | int(0))) }}
        {% else %} false {% endif %}
      {% else %} false {% endif %}
    id: helper
  - platform: template
    value_template: >-
      {% if var_helper %}
        {% set raw = states(var_helper) %}
        {% if raw and raw not in ['unknown','unavailable','--:--'] %}
          {% set tp = raw.split(' ')[-1] %}
          {{ now() >= (today_at(tp) + timedelta(minutes=(var_offset | int(0)) + 3)) }}
        {% else %} false {% endif %}
      {% else %} false {% endif %}
    id: helper_3
  - platform: template
    value_template: >-
      {% if var_helper %}
        {% set raw = states(var_helper) %}
        {% if raw and raw not in ['unknown','unavailable','--:--'] %}
          {% set tp = raw.split(' ')[-1] %}
          {{ now() >= (today_at(tp) + timedelta(minutes=(var_offset | int(0)) + 6)) }}
        {% else %} false {% endif %}
      {% else %} false {% endif %}
    id: helper_6

condition:
  - condition: template
    value_template: >-
      {% if var_helper_var %}
        {{ trigger.id in ['helper', 'helper_3', 'helper_6'] }}
      {% else %}
        {{ trigger.id in ['fija', 'fija_3', 'fija_6'] }}
      {% endif %}
  - condition: state
    entity_id: switch.dira_shabat_shabbat_mode
    state: "on"
  - condition: template
    value_template: >-
      {{ is_state('binary_sensor.dira_shabat_issur_melacha', 'on')
         or (var_permitir_erev
             and is_state('binary_sensor.dira_shabat_erev_shabbat_hag', 'on')) }}
  - condition: template
    value_template: >-
      {% if var_opciones == 'siempre' %} true
      {% else %} {{ is_state('binary_sensor.dira_shabat_dinner_today', var_opciones) }}
      {% endif %}
  - condition: template
    value_template: >-
      {% set dia = states('sensor.dira_shabat_current_day') | int(0) %}
      {% set ultimo = is_state('binary_sensor.dira_shabat_last_day', 'on') %}
      {% if var_dia_filtro == 'cualquiera' %} true
      {% elif var_dia_filtro == 'ultimo' %} {{ ultimo }}
      {% elif var_dia_filtro == 'no_ultimo' %} {{ not ultimo }}
      {% else %} {{ dia == (var_dia_filtro | int) }}
      {% endif %}
  - condition: template
    value_template: >-
      {{ not var_skip_ends or
         is_state('binary_sensor.dira_shabat_ends_today', 'off') }}

action:
  - if:
      - "{{ (light_on | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = light_on.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - if:
                    - "{{ (var_transition | int(0)) > 0 }}"
                  then:
                    - service: light.turn_on
                      data:
                        brightness_pct: "{{ var_brightness | int(100) }}"
                        transition: "{{ var_transition | int(0) }}"
                      target:
                        entity_id: "{{ repeat.item }}"
                      continue_on_error: true
                  else:
                    - service: light.turn_on
                      data:
                        brightness_pct: "{{ var_brightness | int(100) }}"
                      target:
                        entity_id: "{{ repeat.item }}"
                      continue_on_error: true
  - if:
      - "{{ (light_off | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = light_off.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: light.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (switch_on | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = switch_on.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (switch_off | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = switch_off.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: switch.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (fan_on | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = fan_on.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: fan.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (fan_off | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = fan_off.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: fan.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (cover_open | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = cover_open.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: cover.open_cover
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (cover_close | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = cover_close.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: cover.close_cover
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ (airc_on | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = airc_on.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: climate.set_temperature
                  data:
                    hvac_mode: "{{ var_airc_mode | default('cool') }}"
                    temperature: >-
                      {% if var_temp_entity %}
                        {% set v = states(var_temp_entity) %}
                        {{ (v | float(var_temp)) if v not in ['unknown','unavailable'] else var_temp }}
                      {% else %}
                        {{ var_temp }}
                      {% endif %}
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
                - if:
                    - "{{ var_airc_fan_mode != '' }}"
                  then:
                    - service: climate.set_fan_mode
                      data:
                        fan_mode: "{{ var_airc_fan_mode }}"
                      target:
                        entity_id: "{{ repeat.item }}"
                      continue_on_error: true
  - if:
      - "{{ (airc_on_2 | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = airc_on_2.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: climate.set_temperature
                  data:
                    hvac_mode: "{{ var_airc_mode_2 | default('cool') }}"
                    temperature: >-
                      {% if var_temp_entity_2 %}
                        {% set v = states(var_temp_entity_2) %}
                        {{ (v | float(var_temp_2)) if v not in ['unknown','unavailable'] else var_temp_2 }}
                      {% else %}
                        {{ var_temp_2 }}
                      {% endif %}
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
                - if:
                    - "{{ var_airc_fan_mode_2 != '' }}"
                  then:
                    - service: climate.set_fan_mode
                      data:
                        fan_mode: "{{ var_airc_fan_mode_2 }}"
                      target:
                        entity_id: "{{ repeat.item }}"
                      continue_on_error: true
  - if:
      - "{{ (airc_off | default({})) | length > 0 }}"
    then:
      - repeat:
          for_each: >-
            {% set r = airc_off.entity_id | default([]) %}
            {{ ([r] if r is string else r) }}
          sequence:
            - if:
                - >-
                  {{ not var_respeto_override
                     or trigger.id in ['fija', 'helper']
                     or states[repeat.item].last_changed <= scheduled_time }}
              then:
                - service: climate.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
  - if:
      - "{{ var_notify != '' }}"
    then:
      - service: "{{ var_notify }}"
        data:
          message: "Dira Shabat noche → ejecutado @ {{ now().strftime('%H:%M') }}"
        continue_on_error: true
